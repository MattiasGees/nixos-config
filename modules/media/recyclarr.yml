# Declarative Recyclarr config — installed to /etc/recyclarr/recyclarr.yml by
# modules/media/recyclarr.nix. API keys stay OUT of the Nix store via !env_var
# (provide SONARR_API_KEY at sync time). No timer, by choice — run manually:
#   SONARR_API_KEY=<key> recyclarr sync --config /etc/recyclarr/recyclarr.yml --preview
#   SONARR_API_KEY=<key> recyclarr sync --config /etc/recyclarr/recyclarr.yml
#
# Profiles are imported straight from TRaSH by trash_id — recyclarr pulls the full
# profile (qualities, quality groups, score set, and its custom formats + scores).
# The two 1080p profiles share one trash_id (both need an explicit `name:`, or
# recyclarr silently skips the instance), so you can pick per series between
# h264-first (WEB-1080p) and size-first x265 (WEB-1080p x265).
sonarr:
  main:
    base_url: http://localhost:8989
    api_key: !env_var SONARR_API_KEY

    # Quality definitions (per-quality size limits) — the native recyclarr key,
    # NOT a config-templates `include` (recyclarr's bundled includes come up empty
    # on this box, which breaks any `- template:` reference). Profiles + custom
    # formats below come from the guide by trash_id, so no includes are needed.
    quality_definition:
      type: series

    quality_profiles:
      # Default WEB-1080p — untweaked TRaSH profile (h264-first). Explicit name is
      # required because the next profile reuses the same trash_id.
      - trash_id: 72dae194fc92bf828f32cde7744e51a1
        name: WEB-1080p
      # Same TRaSH base, size-first — the x265 (HD) boost below applies to THIS one.
      - trash_id: 72dae194fc92bf828f32cde7744e51a1
        name: WEB-1080p x265
      # WEB-2160p (Combined): prefer 4K, fall back to 1080p.
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7

    custom_formats:
      # Size-first x265 on the "WEB-1080p x265" profile ONLY: flip x265 (HD) from
      # TRaSH's default -10000 to +2000 so any non-junk x265 beats even a top-tier
      # h264 group (e.g. NTb ~+1775). The plain "WEB-1080p" keeps TRaSH defaults
      # (x265 stays -10000 => h264-first), so you choose per series.
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
        assign_scores_to:
          - name: WEB-1080p x265
            score: 2000

# Radarr (movies) — same idea: a default HD profile (h264-first), an x265-favoured
# copy of it, and the UHD profile. The two HD profiles reuse one trash_id, so each
# needs an explicit `name:` (recyclarr silently skips the instance otherwise).
radarr:
  # Instance name must be unique across ALL services (can't reuse sonarr's "main").
  movies:
    base_url: http://localhost:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie
      # Allow smaller x265 encodes. TRaSH's Bluray-1080p floor is 50.8 MB/min
      # (~8.1 GB min for a ~160-min movie), which rejects a legit ~40 MB/min x265.
      # Lower it to 15 MB/min. Sizes are MB-per-minute; this is Radarr-wide (all
      # profiles) but only relaxes the floor — it doesn't force small files.
      qualities:
        - name: Bluray-1080p
          min: 15

    quality_profiles:
      # Default HD Bluray + WEB — untweaked TRaSH profile (h264-first).
      - trash_id: d1d67249d3890e49bc12e275d989a7e9
        name: HD Bluray + WEB
      # Same TRaSH base, size-first — the x265 (HD) boost below applies to THIS one.
      - trash_id: d1d67249d3890e49bc12e275d989a7e9
        name: HD Bluray + WEB x265
      # UHD Bluray + WEB (4K) — default, untweaked.
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f

    custom_formats:
      # Size-first x265 on "HD Bluray + WEB x265" only: flip x265 (HD) from TRaSH's
      # default -10000 to +2000. NOTE: Radarr's x265 (HD) trash_id differs from
      # Sonarr's. The plain "HD Bluray + WEB" keeps TRaSH defaults (h264-first).
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
        assign_scores_to:
          - name: HD Bluray + WEB x265
            score: 2000

      # Downrate HDR at 1080p — HDR is really a 4K feature (a "1080p HDR" release is
      # just a UHD downscale). Penalise it here (-500 each) so a clean SDR x265
      # beats a 1080p HDR downscale; get HDR at 4K via "UHD Bluray + WEB". It's a
      # deprioritise, not a reject — an HDR-only 1080p release still nets +500.
      - trash_ids:
          - 493b6d1dbec3c3364c59d7607f7e3405 # HDR
          - b337d6812e06c200ec9a2d3cfa9d20a7 # DV Boost (Dolby Vision)
          - caa37d0df9c348912df1fb1d88f9273a # HDR10+ Boost
        assign_scores_to:
          - name: HD Bluray + WEB x265
            score: -500

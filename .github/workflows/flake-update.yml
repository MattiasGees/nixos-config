# Weekly `nix flake update` as a PR against `mattias`. The PR description is
# the output of scripts/flake-update.sh: which polaris services change version
# (with changelog links) and which flake inputs moved. Nothing is built here;
# checks.yml runs on the PR, but still try it with `make switch NIXNAME=polaris`
# before merging.
name: flake-update

on:
  schedule:
    - cron: "0 5 * * 5" # Fridays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # vmctl and conductor are private git+ssh inputs; evaluating polaris
      # needs them. Rewrite their SSH URLs to HTTPS with a fine-grained token
      # (Contents: read-only on those two repos), so flake.nix and flake.lock
      # keep git+ssh for local builds.
      - name: Access private flake inputs
        env:
          TOKEN: ${{ secrets.FLAKE_INPUTS_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Update flake.lock
        id: update
        run: |
          scripts/flake-update.sh > "$RUNNER_TEMP/summary.md"
          echo "nixpkgs=$(date -ud "@$(jq '.nodes[.nodes.root.inputs.nixpkgs].locked.lastModified' flake.lock)" +%F)" >> "$GITHUB_OUTPUT"

      # Don't leave the token in ~/.gitconfig for the steps below.
      - name: Forget the flake inputs token
        if: always()
        run: git config --global --remove-section url."https://x-access-token:${TOKEN}@github.com/" || true
        env:
          TOKEN: ${{ secrets.FLAKE_INPUTS_TOKEN }}

      # PRs opened with the default GITHUB_TOKEN don't trigger checks.yml, so use
      # a fine-grained token (Contents and Pull requests: read/write on this repo
      # only). Until that secret exists, the PR opens without checks.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.FLAKE_UPDATE_PR_TOKEN || github.token }}
          branch: automation/flake-update
          base: mattias
          delete-branch: true
          commit-message: "chore: nix flake update (nixpkgs ${{ steps.update.outputs.nixpkgs }})"
          title: "chore: nix flake update (nixpkgs ${{ steps.update.outputs.nixpkgs }})"
          body-path: ${{ runner.temp }}/summary.md
